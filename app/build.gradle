plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ntp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.ntp'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0-android15-autostart'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

